# Render's free plan sleeps after 15 minutes without traffic (then takes ~30s to wake).
# Pinging the health check every 10 minutes keeps TheO awake around the clock.
name: Keep TheO awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health check
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 60 https://theo-ocean.onrender.com/api/health; then exit 0; fi
            sleep 15
          done
          exit 1
